<!doctype html>
<html lang="en">
  <head>
    <!-- ========================================
         BASIC META
    ========================================= -->
    <link rel="manifest" href="/manifest.json" />
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ========================================
         PRIMARY SEO
    ========================================= -->
    <title>
      Productive AI — Free AI Chatbot for Coding, Productivity & Smart
      Conversations
    </title>

    <meta name="title" content="Productive AI — Smart AI Chatbot" />

    <meta
      name="description"
      content="Productive AI is a fast and intelligent AI chatbot built for coding, productivity, learning, writing, brainstorming, and smart AI conversations."
    />

    <meta
      name="keywords"
      content="Productive AI, AI chatbot, free AI chatbot, AI assistant, coding AI, AI for developers, productivity AI, smart assistant, conversational AI, React AI chatbot, AI learning assistant"
    />

    <meta name="author" content="Productive AI" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta name="googlebot" content="index, follow" />

    <meta name="theme-color" content="#020617" />

    <meta name="application-name" content="Productive AI" />

    <meta name="apple-mobile-web-app-title" content="Productive AI" />

    <!-- ========================================
         CANONICAL URL
    ========================================= -->
    <link rel="canonical" href="https://productiveai.com/" />

    <!-- ========================================
         FAVICONS
    ========================================= -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ========================================
         FONT OPTIMIZATION
    ========================================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- ========================================
         OPEN GRAPH SEO
    ========================================= -->
    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Productive AI" />

    <meta property="og:title" content="Productive AI — Smart AI Chatbot" />

    <meta
      property="og:description"
      content="Experience lightning-fast AI conversations, coding help, productivity tools, and smart assistance with Productive AI."
    />

    <meta property="og:url" content="https://productiveai.com/" />

    <meta property="og:image" content="https://productiveai.com/preview.png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta property="og:image:alt" content="Productive AI Chatbot" />

    <meta property="og:locale" content="en_US" />

    <!-- ========================================
         TWITTER SEO
    ========================================= -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Productive AI — AI Chatbot" />

    <meta
      name="twitter:description"
      content="Boost productivity with Productive AI — your modern AI chatbot assistant."
    />

    <meta name="twitter:image" content="https://productiveai.com/preview.png" />

    <!-- ========================================
         PWA SUPPORT
    ========================================= -->
    <link rel="manifest" href="/manifest.json" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- ========================================
         STRUCTURED DATA - ORGANIZATION
    ========================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Productive AI",
        "url": "https://productiveai.com",
        "logo": "https://productiveai.com/logo.png",
        "sameAs": []
      }
    </script>

    <!-- ========================================
         STRUCTURED DATA - SOFTWARE
    ========================================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Productive AI",
        "applicationCategory": "ChatApplication",
        "operatingSystem": "Web",
        "url": "https://productiveai.com",
        "image": "https://productiveai.com/preview.png",
        "description": "Modern AI chatbot for coding, productivity, writing, learning, and intelligent conversations.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- ========================================
         PERFORMANCE OPTIMIZATION
    ========================================= -->
    <meta name="format-detection" content="telephone=no" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>

  <body class="dark-theme">
    <noscript> Productive AI requires JavaScript to run properly. </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
